name: bill_intelligence
description: Home Utility Bill Intelligence — Flutter app (web + iOS + Android)
version: 1.0.0+1
publish_to: none

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase — auth, database, storage
  supabase_flutter: ^2.8.0

  # HTTP — calls to the Python AI service
  http: ^1.2.2

  # Routing — declarative, type-safe
  go_router: ^14.3.0

  # Image / file picking — bill capture
  image_picker: ^1.1.2

  # Environment variables — .env file support
  flutter_dotenv: ^5.2.1

  # Number formatting — tabular figures for currency
  intl: ^0.19.0

  # Charts — spend dashboard (pure-Dart, web + mobile)
  fl_chart: ^0.69.2

  # Path utilities
  path: ^1.9.1

  # State management (settings/register/session)
  provider: ^6.1.2

  # Persistent key-value store (Detail level, language, reminders)
  shared_preferences: ^2.3.2

  # UUID generation for new bill IDs
  uuid: ^4.5.1

  # Google Fonts (runtime fallback) — Inter is also bundled locally below.
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.woff2
          weight: 400
        - asset: assets/fonts/Inter-Medium.woff2
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.woff2
          weight: 600
        - asset: assets/fonts/Inter-Bold.woff2
          weight: 700
