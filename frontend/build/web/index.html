<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Never set maximum-scale=1 — that disables zoom and breaks accessibility -->
  <meta name="description" content="Home Utility Bill Intelligence">
  <title>Bill Intelligence</title>

  <!-- Global design tokens — edit here, propagates everywhere -->
  <link rel="stylesheet" href="styles/globals.css">

  <!-- Make sure the page fills the viewport so Flutter's default body host
       has real dimensions (a zero-size host renders as a blank page). -->
  <style>
    html, body { height: 100%; margin: 0; padding: 0; }
  </style>

  <!-- Flutter bootstrap (auto-initialises into <body>) -->
  <script src="flutter_bootstrap.js" async></script>

  <!-- Theme colour for browser chrome (matches daisyUI base-100) -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF">
  <meta name="theme-color" media="(prefers-color-scheme: dark)"  content="#1D232A">
</head>
<body>
</body>
</html>
