# A Supabase project config file — for local development only.
# Docs: https://supabase.com/docs/guides/cli/config

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"
openai_api_key = ""

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
# The base URL of the Flutter web app.
# Update to your production URL before launch.
site_url = "http://localhost:5000"
additional_redirect_urls = [
  "http://localhost:3000",
  "com.billapp://login-callback"
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# ── OAuth providers ──────────────────────────────────────────────────────
# Fill in client_id and secret from Google / Apple consoles.
# In development with BYPASS_AUTH=true these are not used.

[auth.external.google]
enabled = true
client_id     = "env(GOOGLE_CLIENT_ID)"
secret        = "env(GOOGLE_CLIENT_SECRET)"
redirect_uri  = ""

[auth.external.apple]
enabled = true
client_id     = "env(APPLE_CLIENT_ID)"
secret        = "env(APPLE_CLIENT_SECRET)"
redirect_uri  = ""

[edge_runtime]
enabled = true
policy = "per_worker"

[analytics]
enabled = false
